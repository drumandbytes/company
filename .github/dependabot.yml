version: 2
updates:
  # The only dependencies this repo has are the actions pinned in
  # .github/workflows/. Grouped into one PR so related bumps land together
  # rather than as a stream; CI + auto-merge.yml handle the rest.
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
