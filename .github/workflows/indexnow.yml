name: IndexNow submit

# This site deploys via classic GitHub Pages (legacy build, straight from
# main), with Cloudflare only proxying in front -- not Cloudflare Pages, so
# there's no wrangler step to hook a step onto. deployment_status fires once
# it's actually live instead. GitHub Pages' own deployments always report
# environment "github-pages", not "production" -- confirmed via
# `gh api repos/drumandbytes/company/deployments`.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'github-pages'
    uses: drumandbytes/reusable-actions/.github/workflows/indexnow.yml@v1
    with:
      host: drumandbytes.ee
      key: ${{ vars.INDEXNOW_KEY }}
