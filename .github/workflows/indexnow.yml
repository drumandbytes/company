name: IndexNow submit

# Pages deploys via git integration, no wrangler step here to hook onto --
# deployment_status fires once it's actually live instead.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'production'
    uses: drumandbytes/reusable-actions/.github/workflows/indexnow.yml@v1
    with:
      host: drumandbytes.ee
      key: ${{ vars.INDEXNOW_KEY }}
